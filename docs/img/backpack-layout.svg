<text class="m" x="-23" y="-14" font-size="1.6">MashTouch I/O backpack: basic placement. Back view = backpack component side (same as the vendor back-view drawing). Units mm.</text>
<text class="m" x="-23" y="74.6" font-size="1.5">Board 90 × 59 R5, notch x 74–90, y 17–40 over the panel's chip antenna. M2 holes 72 × 48.5 (dashed: 4.5 mm keepout). Panel USB-C off the LEFT edge.</text>
<text class="m" x="-23" y="76.6" font-size="1.5">J8: pins 1/2 at the USB-C end, odd pins on the outer row (board edge), even pins on the inner row. Gold pads: used by the backpack.</text>
<text class="m" x="-23" y="78.6" font-size="1.5">Grey dashed: panel parts below the backpack (USB-C, 2-pin cable connectors). Positions from the vendor STEP model.</text>
<text class="m" x="-21" y="31" font-size="1.5" transform="rotate(-90 -21 31)" text-anchor="middle">← panel USB-C side</text>
