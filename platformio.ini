; MashTouch - ESP32-S3 touchscreen brew controller
; SPDX-License-Identifier: GPL-3.0-or-later

[platformio]
default_envs = devkit

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lvgl/lvgl@~9.2.2
    lovyan03/LovyanGFX@^1.2.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.2.1
extra_scripts = pre:tools/embed_web.py

; 16 MB QIO flash, 8 MB octal PSRAM (DevKitC-1 N16R8 and the Waveshare board)
[s3_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; Breadboard bring-up: ESP32-S3-DevKitC-1 N16R8 + MSP3526 module
[env:devkit]
extends = s3_n16r8
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMT_BOARD_DEVKIT=1

; Same firmware, uploaded over Wi-Fi to the web API (controller must be idle).
; Change upload_port to the IP if .local names do not resolve. With a web
; password set, add: -u admin:<password> to the curl command.
[env:devkit_ota]
extends = env:devkit
upload_protocol = custom
upload_port = mashtouch.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/ota

; Product: Waveshare ESP32-S3-Touch-LCD-3.5 (V2, ESP32-S3R8: 8 MB octal PSRAM
; in the package, 16 MB QIO flash) + MashTouch I/O backpack on header J8.
; Native USB (CDC) for upload and the console. Pin map: src/board/pins_ws35.h
[env:ws35]
extends = s3_n16r8
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMT_BOARD_WS35=1

[env:ws35_ota]
extends = env:ws35
upload_protocol = custom
upload_port = mashtouch.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/ota
